[package]
name = "zr"
version = "0.5.0"
edition = "2021"
authors = ["zr Language Team"]
description = "zr — a systems programming language with coroutines, CTFE, and a full async runtime"
license = "MIT"
readme = "README.md"
homepage = "https://example.org/zr"
repository = "https://example.org/zr/zr"
keywords = ["compiler", "language", "systems"]
categories = ["compilers"]

[[bin]]
name = "zr"
path = "src/main.rs"

[dependencies]
# 无第三方依赖，仅使用 Rust 标准库

[dev-dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true

[profile.test]
opt-level = 1
